name: PRaccept – SAST, build release image, deploy

on:
  push:
    branches:
      - master

# Prevent concurrent releases racing each other
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/game2048

jobs:
  # ──────────────────────────────────────────
  # Job 1: Detect changed paths
  # Drives conditional execution of downstream jobs:
  #   image → Dockerfile changed → rebuild image, bump appVersion + chart version
  #   helm  → helm/** changed only → re-lint + bump chart version only (same image)
  # fetch-depth: 2 required for push events to diff against previous commit
  # ──────────────────────────────────────────
  detect:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            image:
              - 'Dockerfile'
            helm:
              - 'helm/**'

  # ──────────────────────────────────────────
  # Job 2: Helm lint
  # Runs when helm chart or Dockerfile changed
  # ──────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.image == 'true' || needs.detect.outputs.helm == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint ./helm/game2048

  # ──────────────────────────────────────────
  # Job 3: SAST — Semgrep
  # Only runs when Dockerfile changed (image rebuild needed)
  # ──────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.image == 'true'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: pip install semgrep --quiet

      - name: Run Semgrep SAST (fail on ERROR severity)
        run: semgrep scan --config=auto --error --severity=ERROR --sarif-output=semgrep.sarif .

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true  # requires GitHub Advanced Security on private repos
        with:
          sarif_file: semgrep.sarif

  # ──────────────────────────────────────────
  # Job 4: Compute next semantic version
  # Runs when anything meaningful changed
  #
  # Version strategy:
  #   Dockerfile changed → bump BOTH appVersion AND chart version
  #   Helm-only changed  → bump chart version ONLY (same image, new config)
  #
  # This ensures ArgoCD always syncs on any release, but the Docker
  # image tag only changes when the application code actually changed.
  # ──────────────────────────────────────────
  compute-version:
    name: Compute Next Version
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.image == 'true' || needs.detect.outputs.helm == 'true'
    outputs:
      app_version: ${{ steps.bump.outputs.app_version }}
      chart_version: ${{ steps.bump.outputs.chart_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Compute versions
        id: bump
        run: |
          CURRENT_APP=$(yq '.appVersion' helm/game2048/Chart.yaml | tr -d '"')
          CURRENT_CHART=$(yq '.version' helm/game2048/Chart.yaml)

          # Always bump chart version (any release changes the chart)
          IFS='.' read -r major minor patch <<< "$CURRENT_CHART"
          NEXT_CHART="${major}.${minor}.$((patch + 1))"

          # Only bump appVersion if Dockerfile changed (new image)
          if [[ "${{ needs.detect.outputs.image }}" == "true" ]]; then
            IFS='.' read -r major minor patch <<< "$CURRENT_APP"
            NEXT_APP="${major}.${minor}.$((patch + 1))"
            echo "Dockerfile changed → bumping appVersion: $CURRENT_APP → $NEXT_APP"
          else
            NEXT_APP="$CURRENT_APP"
            echo "Helm-only change → keeping appVersion: $CURRENT_APP (same image)"
          fi

          echo "Chart version → bumping: $CURRENT_CHART → $NEXT_CHART"
          echo "chart_version=${NEXT_CHART}" >> "$GITHUB_OUTPUT"
          echo "app_version=${NEXT_APP}" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────
  # Job 5: Build and push release image
  # Only runs when Dockerfile changed
  # Tags: <appVersion> + latest
  # ──────────────────────────────────────────
  build-push:
    name: Build & Push Release Image
    runs-on: ubuntu-latest
    needs: [detect, helm-lint, sast, compute-version]
    if: needs.detect.outputs.image == 'true'
    permissions:
      contents: read
      packages: write

    outputs:
      full_image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.compute-version.outputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.compute-version.outputs.app_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ──────────────────────────────────────────
  # Job 6: Docker image vulnerability scan
  # Only runs when a new image was built
  # Blocks release on HIGH or CRITICAL fixable CVEs
  # ──────────────────────────────────────────
  security-scan:
    name: Image Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [detect, build-push]
    if: needs.detect.outputs.image == 'true'
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy (table output for visibility)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-push.outputs.full_image }}
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy (fail on HIGH or CRITICAL with available fix)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-push.outputs.full_image }}
          format: sarif
          output: trivy.sarif
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true  # requires GitHub Advanced Security on private repos
        with:
          sarif_file: trivy.sarif

  # ──────────────────────────────────────────
  # Job 7: Tag release commit + bump Chart.yaml
  #
  # Safety gate — only runs if ALL required jobs passed:
  #   - helm-lint must succeed (always required)
  #   - sast must succeed OR was skipped (skipped = helm-only change, no image)
  #   - build-push must succeed OR was skipped (skipped = helm-only change)
  #   - security-scan must succeed OR was skipped (skipped = helm-only change)
  #
  # Version bump logic:
  #   - Always bumps chart version (every release updates the chart)
  #   - Only bumps appVersion if Dockerfile changed (new image was built)
  #   - Git tag (v{appVersion}) only created on image changes
  # ──────────────────────────────────────────
  bump-and-tag:
    name: Bump Chart.yaml
    runs-on: ubuntu-latest
    needs: [detect, helm-lint, sast, compute-version, build-push, security-scan]
    if: |
      always() &&
      (needs.detect.outputs.image == 'true' || needs.detect.outputs.helm == 'true') &&
      needs.helm-lint.result == 'success' &&
      (needs.sast.result == 'success' || needs.sast.result == 'skipped') &&
      (needs.build-push.result == 'success' || needs.build-push.result == 'skipped') &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Bump Chart.yaml
        run: |
          NEW_APP="${{ needs.compute-version.outputs.app_version }}"
          NEW_CHART="${{ needs.compute-version.outputs.chart_version }}"

          yq -i ".version = \"${NEW_CHART}\"" helm/game2048/Chart.yaml
          yq -i ".appVersion = \"${NEW_APP}\"" helm/game2048/Chart.yaml

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add helm/game2048/Chart.yaml

          if [[ "${{ needs.detect.outputs.image }}" == "true" ]]; then
            git commit -m "ci: bump Chart.yaml appVersion=${NEW_APP} version=${NEW_CHART} [skip ci]"
          else
            git commit -m "ci: bump Chart.yaml version=${NEW_CHART} (helm-only change) [skip ci]"
          fi
          git push

  # ──────────────────────────────────────────
  # Job 8: Trigger ArgoCD sync
  #
  # PURPOSE:
  #   ArgoCD already watches master and auto-syncs every ~3 minutes.
  #   This job forces an IMMEDIATE sync so the deployment happens
  #   right after the version bump, without waiting for the poll cycle.
  #
  # HOW IT WORKS:
  #   - Installs the ArgoCD CLI on the runner
  #   - Calls `argocd app sync` to trigger a sync remotely via ArgoCD API
  #   - Then waits for the app to reach Healthy status before marking success
  #
  # REQUIREMENTS (GitHub repo secrets):
  #   - ARGOCD_SERVER : hostname/IP of the ArgoCD server (e.g. argocd.example.com)
  #   - ARGOCD_TOKEN  : ArgoCD API token (generate with `argocd account generate-token`)
  #
  # LOCAL DEVELOPMENT NOTE:
  #   When ArgoCD runs locally (Docker Desktop), the GitHub Actions runner
  #   cannot reach localhost:8080. In that case this job will fail gracefully
  #   (continue-on-error: true) and ArgoCD will still auto-sync within ~3 minutes.
  #   For production, expose ArgoCD via a LoadBalancer or Ingress and set the secrets.
  # ──────────────────────────────────────────
  deploy:
    name: Trigger ArgoCD Sync
    runs-on: ubuntu-latest
    needs: [detect, bump-and-tag]
    if: |
      always() &&
      needs.bump-and-tag.result == 'success' &&
      (needs.detect.outputs.image == 'true' || needs.detect.outputs.helm == 'true')
    environment: production
    continue-on-error: true  # gracefully skip if ARGOCD_SERVER is not reachable (local dev)

    steps:
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Trigger sync and wait for healthy
        run: |
          argocd app sync game2048 \
            --server ${{ secrets.ARGOCD_SERVER }} \
            --auth-token ${{ secrets.ARGOCD_TOKEN }} \
            --insecure \
            --timeout 120
          argocd app wait game2048 \
            --server ${{ secrets.ARGOCD_SERVER }} \
            --auth-token ${{ secrets.ARGOCD_TOKEN }} \
            --insecure \
            --health \
            --timeout 120
