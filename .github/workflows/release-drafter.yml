name: Release Drafter

on:
  # Wait for pr_accept to finish before creating the release
  # This ensures the release points to the bumped Chart.yaml commit
  workflow_run:
    workflows: ["PRaccept – SAST, build release image, deploy"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

jobs:
  draft-release:
    name: Draft GitHub Release
    # Only run when pr_accept succeeded (or manual trigger)
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Draft and publish release
        id: drafter
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "Tag:  ${{ steps.drafter.outputs.tag_name }}"
          echo "Name: ${{ steps.drafter.outputs.name }}"
          echo "URL:  ${{ steps.drafter.outputs.html_url }}"
